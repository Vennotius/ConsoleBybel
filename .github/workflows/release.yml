# Builds and runs the program on each kind of machine. A tag (v1.0) also makes a release.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-2022, exe: lees-bybel.exe, pty: pywinpty }
          # 22.04: its glibc (2.35) is older than that of Raspberry Pi OS Bookworm (2.36).
          - { rid: linux-x64, os: ubuntu-22.04, exe: lees-bybel, pty: ptyprocess }
          - { rid: linux-arm64, os: ubuntu-22.04-arm, exe: lees-bybel, pty: ptyprocess }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - run: dotnet publish -c Release -r ${{ matrix.rid }} -o out
      - name: Run it in a terminal
        run: |
          python -m pip install ${{ matrix.pty }}
          python .github/run.py out/${{ matrix.exe }}
        env:
          PYTHONIOENCODING: utf-8
      - name: Archive
        run: |
          name=lees-bybel-${{ matrix.rid }}
          mkdir $name
          cp out/${{ matrix.exe }} README.md LICENSE $name
          cp "$DOTNET_ROOT/LICENSE.txt" $name/dotnet-LICENSE.txt
          cp "$DOTNET_ROOT/ThirdPartyNotices.txt" $name/dotnet-ThirdPartyNotices.txt
          if [ ${{ runner.os }} = Windows ]; then 7z a $name.zip $name; else tar -czf $name.tar.gz $name; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" *.zip *.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
